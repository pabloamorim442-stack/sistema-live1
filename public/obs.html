<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Exibição na Live</title>
    <script src="https://cdn.pubnub.com/sdk/javascript/pubnub.7.2.2.min.js"></script>
    <style>
        body {
            margin: 0;
            background: transparent;
            overflow: hidden;
        }
        video {
            width: 100vw;
            height: 100vh;
            display: none;
            object-fit: contain;
        }
    </style>
</head>
<body>

    <video id="player" src="meu_video.mp4"></video>

    <script>
        const player = document.getElementById('player');

        const pubnub = new PubNub({
            subscribeKey: "sub-c-demo",
            userId: "obs-studio"
        });

        pubnub.subscribe({
            channels: ["canal-live-tiktok"]
        });

        pubnub.addListener({
            message: function(event) {
                if (event.message.acao === "tocar") {
                    player.currentTime = 0;
                    player.style.display = "block";
                    player.play().catch(e => console.log(e));
                }
            }
        });

        player.onended = () => {
            player.style.display = "none";
        };
    </script>
</body>
</html>

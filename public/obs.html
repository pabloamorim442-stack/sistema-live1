<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Exibição na Live</title>
    <script src="https://cdn.pubnub.com/sdk/javascript/pubnub.7.2.2.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: transparent; overflow: hidden; width: 100vw; height: 100vh; }
        video { width: 100%; height: 100%; display: none; object-fit: contain; }
    </style>
</head>
<body>

    <video id="player" src="meu_video.mp4" playsinline muted></video>

    <script>
        const player = document.getElementById('player');

        const pubnub = new PubNub({
            subscribeKey: "sub-c-demo",
            userId: "obs-studio-" + Math.random()
        });

        pubnub.subscribe({
            channels: ["canal-live-tiktok"]
        });

        pubnub.addListener({
            message: function(event) {
                if (event.message.acao === "tocar") {
                    // Recarrega o vídeo do início
                    player.currentTime = 0;
                    player.style.display = "block";
                    
                    // Tenta tocar o vídeo
                    const promise = player.play();
                    if (promise !== undefined) {
                        promise.then(() => {
                            // Ativa o som após iniciar a reprodução
                            player.muted = false;
                        }).catch(error => {
                            console.log("Erro ao reproduzir:", error);
                        });
                    }
                }
            }
        });

        player.onended = () => {
            player.style.display = "none";
            player.muted = true;
        };
    </script>
</body>
</html>

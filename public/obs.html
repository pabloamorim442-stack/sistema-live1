<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Exibição na Live</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        body { margin: 0; background: transparent; overflow: hidden; }
        video { width: 100vw; height: 100vh; display: none; object-fit: contain; }
    </style>
</head>
<body>

    <video id="player" src="meu_video.mp4" playsinline></video>

    <script>
        const player = document.getElementById('player');
        const socket = io("https://pie-socket-demo.day.app");

        socket.on("evento-live-pablo", function(msg) {
            if (msg === "tocar") {
                player.currentTime = 0;
                player.style.display = "block";
                player.play().catch(err => console.log("Erro de reprodução:", err));
            }
        });

        player.onended = () => {
            player.style.display = "none";
        };
    </script>
</body>
</html>

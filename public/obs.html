<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Exibição na Live</title>
    <script src="https://cdn.ably.com/lib/ably.min-1.js"></script>
    <style>
        * { margin: 0; padding: 0; }
        body { background: transparent; overflow: hidden; width: 100vw; height: 100vh; }
        video { width: 100%; height: 100%; display: none; object-fit: contain; }
    </style>
</head>
<body>

    <video id="player" src="meu_video.mp4" playsinline muted></video>

    <script>
        const player = document.getElementById('player');
        const ably = new Ably.Realtime('xV33tw.9o2_8g:fP1K5sL3K4j7X8z9');
        const channel = ably.channels.get('canal-live-pablo');

        channel.subscribe('tocar', function(message) {
            player.currentTime = 0;
            player.style.display = 'block';
            
            // Toca com som ativado
            player.muted = false;
            const promise = player.play();
            
            if (promise !== undefined) {
                promise.catch(error => {
                    // Se o navegador bloquear o som, toca mudo
                    player.muted = true;
                    player.play();
                });
            }
        });

        player.onended = () => {
            player.style.display = 'none';
        };
    </script>
</body>
</html>

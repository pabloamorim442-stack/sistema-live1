<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Painel de Controle - Live</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f2f5;
        }
        button {
            padding: 20px 40px;
            font-size: 20px;
            font-weight: bold;
            color: white;
            background-color: #28a745;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        button:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>

    <button onclick="enviarVideo()">Enviar Vídeo para a Live</button>

    <script>
        function enviarVideo() {
            fetch('/disparar-video', { method: 'POST' })
                .then(res => res.json())
                .then(data => alert('Vídeo exibido na Live!'))
                .catch(err => alert('Erro ao disparar vídeo.'));
        }
    </script>
</body>
</html>

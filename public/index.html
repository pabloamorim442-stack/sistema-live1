<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Painel da Live</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        body { display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background-color: #121212; font-family: sans-serif; }
        button { padding: 20px 40px; font-size: 22px; font-weight: bold; color: white; background-color: #28a745; border: none; border-radius: 10px; cursor: pointer; }
    </style>
</head>
<body>

    <button onclick="disparar()">Enviar Vídeo para a Live</button>

    <script>
        // Conecta a um servidor Socket público gratuito
        const socket = io("https://pie-socket-demo.day.app");

        function disparar() {
            socket.emit("evento-live-pablo", "tocar");
            alert("Sinal enviado!");
        }
    </script>
</body>
</html>

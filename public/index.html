<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Painel da Live</title>
    <script src="https://cdn.pubnub.com/sdk/javascript/pubnub.7.2.2.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #121212;
        }
        button {
            padding: 25px 50px;
            font-size: 24px;
            font-weight: bold;
            color: white;
            background-color: #28a745;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(40, 167, 69, 0.4);
        }
        button:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <button onclick="enviarVideo()">Enviar Vídeo para a Live</button>

    <script>
        const pubnub = new PubNub({
            publishKey: "pub-c-demo",
            subscribeKey: "sub-c-demo",
            userId: "painel-controle"
        });

        function enviarVideo() {
            pubnub.publish({
                channel: "canal-live-tiktok",
                message: { acao: "tocar" }
            }, function(status, response) {
                alert("Vídeo enviado para a Live!");
            });
        }
    </script>
</body>
</html>
